<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:16px;display:flex;flex-direction:column;gap:12px}
.top,.modes{display:flex;gap:6px;flex-wrap:wrap}
.top{justify-content:flex-end}.modes{justify-content:center}
.lang,.mode{background:var(--card);color:var(--fg);border:2px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.lang.on,.mode.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mode:disabled{opacity:.35;cursor:default}
.logo{width:84px;height:84px;display:block;margin:0 auto}
#lvdesc{white-space:pre-line;color:var(--fg)}
h1{margin:0;font-size:26px;text-align:center}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-top:-6px}
.score{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 16px;font-weight:700}
.score small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.arena{display:flex;align-items:flex-start;justify-content:center;gap:12px;min-height:170px}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:170px}
.badge{font-size:12px;font-weight:700;color:var(--pow);min-height:16px}
.card{width:68px;height:100px;border-radius:12px;background:var(--card);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;font-weight:800;transition:transform .15s;color:var(--fg);font-family:inherit}
.card small{font-size:11px;font-weight:600;color:var(--muted)}
.card.back{background:repeating-linear-gradient(45deg,var(--accent),var(--accent) 6px,transparent 6px,transparent 12px);color:transparent}
.arena .card{width:92px;height:136px;font-size:42px}
.arena .win{border-color:var(--win);transform:translateY(-6px)}
.arena .lose{border-color:var(--lose);opacity:.7}
.vs{font-weight:800;color:var(--muted);margin-top:56px}
#msg{text-align:center;font-weight:700;min-height:44px}
.hand,.pows{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hand .card{cursor:pointer}
.hand .card:active{transform:scale(.94)}
.hand .card:disabled{opacity:.35;cursor:default}
.pow{background:var(--card);border:2px solid var(--pow);color:var(--fg);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px}
.pow small{font-weight:500;color:var(--muted);font-size:11px}
.pow.on{background:var(--pow);color:#fff}
.pow.on small{color:#fff}
.pow:disabled{opacity:.3;cursor:default;border-style:dashed}
.lbl{text-align:center;font-size:12px;color:var(--muted);margin-bottom:-6px}
button.btn{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.mid{text-align:center}
#lobby{display:none;flex-direction:column;gap:8px;align-items:center;background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:10px}
#lobbyIn{display:flex;gap:8px}
#code{border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px;background:var(--bg);color:var(--fg);width:150px;font-family:inherit}
#lstat{font-size:13px;color:var(--muted);text-align:center}
.rules{background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--muted);line-height:1.5}

body{font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Hiragino Maru Gothic ProN","Segoe UI",system-ui,sans-serif;background:radial-gradient(circle at 10% 6%,var(--glow) 0,transparent 42%),radial-gradient(circle at 90% 94%,var(--glow) 0,transparent 42%),var(--bg);background-attachment:fixed}
body::before,body::after{position:fixed;font-size:34px;opacity:.3;pointer-events:none}
body::before{content:"🌸";top:8px;left:10px}body::after{content:"⭐";bottom:10px;right:12px}
h1{color:var(--accent2);letter-spacing:.4px}
.score{border-radius:24px;box-shadow:0 4px 0 var(--line)}

button.btn{box-shadow:0 4px 0 #0002}

.logo{border-radius:26px;box-shadow:0 5px 0 var(--line);animation:bob 2.4s ease-in-out infinite}

.zone{display:flex;align-items:center;justify-content:center;gap:10px}

/* tela 1: carregando */
#s1{align-items:center;justify-content:center;text-align:center;gap:16px;cursor:pointer}

const close=()=>{if(!alive)return;alive=false;ov.remove();Fx.duck(false);coinDisp=coins;coinUI();if(mode==="camp"&&campWin&&lv<LV.length-1)lv++;toMenu()};
ov.onclick=()=>{if(performance.now()-t0>700)close()};
if(gain){const r=$("coinBtn").getBoundingClientRect(),lr=ov.querySelector(".l1").getBoundingClientRect(),oc=document.createElement("div");oc.id="ovcoin";oc.style.cssText="left:"+r.left+"px;top:"+r.top+"px;width:"+r.width+"px;height:"+r.height+"px";oc.innerHTML='<span class="coin"></span><b></b>';const nb=oc.querySelector("b");nb.textContent=coinDisp;ov.appendChild(oc);
for(let i=0;i<coinAmt;i++)setTimeout(()=>{if(!alive)return;const c=document.createElement("span");c.className="coin fly";const sx=lr.left+lr.width/2+(Math.random()-.5)*70,sy=lr.top+lr.height/2;c.style.left=(sx-17)+"px";c.style.top=(sy-17)+"px";ov.appendChild(c);
const dx=r.left+r.width/2-sx,dy=r.top+16-sy,an=c.animate([{transform:"translate(0,0) scale(1.5)"},{transform:"translate("+dx+"px,"+dy+"px) scale(.7)"}],{duration:850,easing:"cubic-bezier(.55,0,.9,.5)"});
an.onfinish=()=>{c.remove();if(!alive)return;coinDisp++;nb.textContent=coinDisp;oc.classList.remove("pulse");void oc.offsetWidth;oc.classList.add("pulse");Fx.coin()}},1100+i*240)}
const cvs=ov.querySelectorAll("canvas");ov.className=kind;if(kind==="win")startFireworks(cvs[0],cvs[1],()=>alive);else cvs.forEach(c=>c.remove())}
let wantMu=true;try{wantMu=localStorage.getItem("qgd-music")!=="off"}catch(e){}
const muUi=()=>{$("mus").textContent=wantMu?"🔊":"🔇"};
document.addEventListener("pointerdown",()=>{if(wantMu&&!Mu.on)Mu.start();muUi()},{once:true});
$("mus").onclick=()=>{if(wantMu){Mu.stop();wantMu=false}else{Mu.start();wantMu=true}try{localStorage.setItem("qgd-music",wantMu?"on":"off")}catch(x){}muUi()};
document.addEventListener("visibilitychange",()=>{if(!Mu.on||!Mu.ctx)return;if(document.hidden)Mu.ctx.suspend();else{Mu.ctx.resume();Mu.next=Mu.ctx.currentTime+.05}});
muUi();show(1);
start();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
